# Used by the Cloud Build trigger (console Run). Sync job never submits this.
# _MODE=plan  -> terraform plan only
# _MODE=apply -> plan then apply

substitutions:
  _MODE: apply
  _TF_STATE_BUCKET: ""
  _TF_SOURCE_BUCKET: ""
  _TF_SOURCE_OBJECT: source/edge-https-lb.tgz
  _PROJECT_ID: ""
  _REGION: us-central1
  _NAME_PREFIX: venafi-cert-edge
  _SECRET_CERT: edge-tls-certificate
  _SECRET_KEY: edge-tls-private-key
  _STATUS_APP_IMAGE: ""

steps:
  - name: gcr.io/cloud-builders/gsutil
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gsutil cp "gs://${_TF_SOURCE_BUCKET}/${_TF_SOURCE_OBJECT}" /workspace/src.tgz
        tar xzf /workspace/src.tgz -C /workspace

  - name: hashicorp/terraform:1.9
    dir: terraform
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        cat > terraform.tfvars <<EOF
        project_id         = "${_PROJECT_ID}"
        region             = "${_REGION}"
        name_prefix        = "${_NAME_PREFIX}"
        secret_cert_name   = "${_SECRET_CERT}"
        secret_key_name    = "${_SECRET_KEY}"
        status_app_image   = "${_STATUS_APP_IMAGE}"
        tf_state_bucket    = "${_TF_STATE_BUCKET}"
        EOF
        terraform init -input=false -reconfigure \
          -backend-config="bucket=${_TF_STATE_BUCKET}" \
          -backend-config="prefix=edge-https-lb"
        echo "======== TERRAFORM PLAN ========"
        terraform plan -input=false -no-color -out=tfplan
        echo "======== PLAN DETAILS ========"
        terraform show -no-color tfplan
        if [ "${_MODE}" = "plan" ]; then
          echo "MODE=plan; apply skipped"
          exit 0
        fi
        echo "======== TERRAFORM APPLY ========"
        terraform apply -input=false -auto-approve tfplan

timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
